[package]
name = "calendar_app_lib"
version = "0.9.5"
authors = ["Daniel Boline <ddboline@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
blake3 = {version="1.8", features=["rayon"]}
clap = {version="4.6", features=["derive"]}
derive_more = {version="2.1", features=["full"]}
deadpool-postgres = { version = "0.14", features=["serde"] }
deadqueue = "0.2"
dirs = "6.0"
dotenvy = "0.15"
envy = "0.4"
futures = "0.3"
gcal_lib = {path="../gcal_lib"}
hex = "0.4"
itertools = "0.14"
log = "0.4"
postgres-types = "0.2"
postgres_query = {git = "https://github.com/ddboline/rust-postgres-query", tag = "0.3.9", features=["deadpool"]}
rayon = "1.12"
refinery = {version="0.9", features=["tokio-postgres"]}
reqwest = {version="0.13", features=["cookies", "json", "gzip"]}
select = "0.6"
serde = {version="1.0", features=["derive"]}
serde_json = "1.0"
smallvec = "1.15"
stack-string = { version="1.1", features=["postgres_types"] }
stdout-channel = "0.6"
time = {version="0.3", features=["serde-human-readable", "macros", "formatting", "parsing"]}
time-tz = {version="2.0", features=["system"]}
tokio = {version="1.52", features=["rt", "macros", "rt-multi-thread"]}
tokio-postgres = {version = "0.7", features = ["with-time-0_3", "with-uuid-1", "with-serde_json-1"]}
url = "2.5"
uuid = {version="1.23", features=["v4"]}
